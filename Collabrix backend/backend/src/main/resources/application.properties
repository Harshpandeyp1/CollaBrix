spring.application.name=collabrix

# Frontend origins allowed by CORS / WebSocket
app.cors.allowed-origins=http://localhost:5173,https://collabrix-rrvz.onrender.com

# JWT Configuration
jwt.secret=${jwtSecret:collabrix-dev-jwt-secret-change-me-32b}
jwt.expiration=86400000

# Aiven MySQL — must be jdbc:mysql:// (not mysql://) and sslMode=REQUIRED (not ssl-mode)
spring.datasource.url=${db}
spring.datasource.username=${username}
spring.datasource.password=${password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

file.upload-dir=uploads
server.port=8080
server.tomcat.basedir=${user.home}/tomcat-tmp
